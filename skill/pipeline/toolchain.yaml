# toolchain 门禁 profile（工具链/协议类需求；总览 §6.5 定稿）
# 适用：无 DB/无 RPC/无 TAPD/无部署上线的工具与流程类需求（如 dev-swarm 自身）
# 链（D001/D002）：9 阶段——02 服务拆分/08 提测/10 发布CheckList 退链留库（java-business 仍用）
# 在途需求链以建项时 current.md phases 冻结为准（B2-A），不随本文件演进变化
schema: 1
profile: toolchain
phases: [需求分析, 技术方案, 方案审查, 开发编码, 代码审查, 单元测试, Agent自动化测试, 复盘, 知识库更新]
advance_gates:            # F07（D005）：推进门禁 auto/human——优先于仓级 nodes.stages.*.gate 兜底；与下方 gates:（产物质量清单）语义隔离；仅含链内阶段
  需求分析: auto
  技术方案: auto
gates:
  需求分析:
    - 机制清单显式继承或显式声明不适用；硬约束清单化（可机器核对）
    - 盘点对账（F04/D003-v3）：01 声称文件数/清单时留 ```inventory 对账块（cmd:/当轮输出:/声明:），当轮 check_inventory.py 可核对
  技术方案:
    - 前置节：交付物模块边界表 + 仓库状态表（原 02 服务拆分质量清单平移，含 M×F/C 影响矩阵映射）；无代码扫描环节
    - 文件契约 schema 完整（字段/写权限/消费方）；无 DDL/接口章节写"不涉及"
  方案审查:
    - 三方对齐矩阵（需求↔拆分↔方案）逐项核对；差异分级；放行结论明确
  开发编码:
    - 每功能点独立状态（✅/🔶/❌），禁止按服务聚合掩盖缺口
    - 产物写后回读校验（grep/行数）；markdown 产物围栏配对检查
    - 检查类证据必带「证据覆盖面：工程/目录/命令（含退出码）」三要素（F01/D003-v3）
    - 状态表禁止预标未完成项（文档说完成但代码没完成 = 核心红线）
  代码审查:
    - 契约一致性审查（方案契约 vs 实现文件）；残留扫描（scan_terms）
    - 脚本可执行性实证（跑了才算，代码阅读不算环境通过）
  单元测试:
    - 脚本类产物带可执行测试（scan_terms 模式）；无 Java 单测环节写"不涉及"
    - 检查类证据必带「证据覆盖面」三要素（F01/D003-v3）
  Agent自动化测试:
    - 状态六词 + 三文件一致性；已知缺口必列
    - 复验未过先答「下一层」，禁止原补丁打补丁
  复盘:
    - 已知缺口必列；机制有效性回评（哪些门禁真的拦住了问题）
    - 11 必含「KB 候选」节（无条目写「无」）；本节点不自动入库，沉淀等 workflow-learnings-to-kb 人工 gate（F06/D003-v3）
  知识库更新:
    - 自动节点：本类需求无 GitNexus 重建时写"不涉及"并说明
