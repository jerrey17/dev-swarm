# data-script 门禁 profile（刷数/取数类需求；profile场景定制 D001/D002）
# 适用：不改业务代码、无需发布，以脚本完成刷数/取数与验证的需求（services.yaml kind: data-script 声明）
# 链：7 阶段——01 需求分析 → 03 技术方案 → 04 方案审查 → 13 编写脚本和验证脚本（human）→ 09 Agent自动化测试 → 11 复盘 → 12 知识库更新
# 在途需求链以建项时 current.md phases 冻结为准（B2-A）
schema: 1
profile: data-script
phases: [需求分析, 技术方案, 方案审查, 编写脚本和验证脚本, Agent自动化测试, 复盘, 知识库更新]
advance_gates:            # F07/D002：推进门禁——优先于仓级 nodes.stages.*.gate 兜底；13=硬卡（human 拍板才执行数据变更）
  需求分析: auto
  技术方案: auto
  编写脚本和验证脚本: human
gates:
  需求分析:
    - 口径/范围/影响数据表清单化（表名+预估行数+环境）；无代码改动声明
  技术方案:
    - SQL 七要素：数据范围/取数规则/写表/变更时机/事务/回滚/验证断言
    - 文件契约 schema 完整（字段/写权限/消费方）；DDL 若涉及单列并注明评审要求
  方案审查:
    - 数据安全三条预审：可回滚/有备份/影响范围有预览——缺一打回
  编写脚本和验证脚本:
    - 四件套齐（forward.sql/rollback.sql/verify.sql/README.md 预览记录）
    - 数据安全五条落实（预览/备份/回滚/事务限流/验证断言）；不可回滚操作须 human 特批落 decisions
  Agent自动化测试:
    - reverify 数据根=目标库（刷数类禁「无」）；实例列无部署单元写「无」
    - 状态六词 + 三文件一致性；已知缺口必列
  复盘:
    - 已知缺口必列；数据安全机制有效性回评
  知识库更新:
    - 自动节点：本类需求无 GitNexus 重建时写"不涉及"并说明；可复用脚本沉淀入知识库（human 审核）
