# java-business 门禁 profile（8 阶段门禁平移自 Cursor 复盘「阶段门禁」节，映射到 13 阶段编号）
# 适用：Java 业务需求（有 DB/RPC/TAPD/部署上线）
schema: 1
profile: java-business
ops_dir: skill/pipeline/ops/    # 各阶段操作卡目录（V2-R1：01~03 子 skill 调用约定自 dev-workflow SKILL.md 迁出）
phases: [需求分析, 服务拆分, 技术方案, 方案审查, 开发编码, 代码审查, 单元测试, 提测, Agent自动化测试, 发布CheckList, 发布验证与观测, 复盘, 知识库更新]   # 发布验证与观测=库号 14 追加（K1：链位由本行书写序定）
advance_gates:            # F07（D005）：推进门禁 auto/human——优先于仓级 nodes.stages.*.gate 兜底；与下方 gates:（产物质量清单）语义隔离
  需求分析: human        # 01 后停等 human：跟产品对差异/不确定点（D005）
  服务拆分: human        # 02 拆分思路 human check
  技术方案: human        # 03 评审→整改→确认达标才下一手
gates:
  需求分析:
    - 状态词写成唯一组合（如「证书可用 = 认证成功且发证成功」），中间态各有对外文案
    - 会反转的口径写进决策记录，并点名要改的注释、文档和单测（039/040/041 教训）
    - 依赖环境开关的验收（灰度/全量）写明测试环境如何进入、谁改、验完如何恢复
    - 盘点对账（F04/D003-v3）：01 声称文件数/清单时留 ```inventory 对账块（cmd:/当轮输出:/声明:），当轮 check_inventory.py 可核对
  服务拆分:
    - 跨服务字段立契约表：字段名、所在层级、单位、枚举值、哪一列库表（045/052/061）
    - 渠道字段和我方字段分开写；渠道幂等/处理中/空操作以渠道协议为准，方案旧句子删掉（027/053）
  技术方案:
    - 页面展示字段写清单位和空值文案，与接口同节
    - 方案变更当天改文档，废弃路径缺陷收成已关闭并写明原因（009/010）
    - 状态机每一列写「谁写、何时写、失败是否回滚」（025/047）
  方案审查:
    - 三方对齐矩阵（需求↔拆分↔方案）逐项核对；差异分级（阻断/建议）；放行结论明确
  开发编码:
    - 进 05 前核对 decisions 有「产研测评审」记录（三态：通过/带修改通过/打回），无→blockers 挂「待产研测评审」（F08/D003-v3·D004：仅 java 链；toolchain/data-script 链 05=纯拍板）
    - 检查类证据必带「证据覆盖面：工程/目录/命令（含退出码）」三要素（F01/D003-v3）
    - 失败带着原因出去：业务码/状态码/响应体至少留一种（002/006/011/014/015/022/043）
    - 模型和表一起改：查不存在的列、表有列模型没映射都算缺陷（036/061）
    - 任务类先证明能取到 Bean，再证明核心方法非空实现（030/031）
  代码审查:
    - 代码质量清单 + 需求完成度逐功能点核对 + 代码路径审查；环境实跑归 09（禁止代码阅读写成环境通过）
  单元测试:
    - 检查类证据必带「证据覆盖面」三要素（F01/D003-v3）
    - 单测覆盖状态列写入结果，不只覆盖方法被调用（024/025/044/047）
    - 页面请求以浏览器实际 URL、Content-Type 和响应为准（062）
    - 注释、文档、单测与口径反转绑在同一次改动（039/040/041）
  提测:
    - 单列「不满足就不能开始正向用例」前置节：已发证企业 uid/灰度开关进入方式/渠道回调谁转发第几笔终态/容器内域名可解析/冒烟清单回写同一份记录
  Agent自动化测试:
    - 状态只用六词，索引和单文件相同（033/039/040/041）
    - 环境问题只解释某一次失败，规范不达标仍是待修复（017）
    - 一条缺陷修复部署后就复验，不堆积批次（062 部署两次教训）
    - 四步法：先写用例、只改测试库并还原、报文库表对字段、缓存异常单独看
  发布CheckList:
    - 三块式：我要操作的（有序）/ 我要关注的 / 如何回退；配置类回填项纳入
    - 发布产物（K5）：按实际发布内容落可执行产物文件于 `10-发布CheckList/` 子目录（七类参考：DDL/刷数 SQL/白名单 SQL/Apollo 配置清单/OA 菜单与权限/Saturn 作业与备份/回滚预案）；没有的类别不强造空文件；有的类别必须落成产物文件，不得只写在清单正文
  发布验证与观测:
    - 只验证 human 通知的那一项，不代操作发布平台、不代通知（触发协议见 ops/14）
    - 脚本与生产数据核对以发布产物文件为对照物（表/字段/类型），不只看执行成功
    - 每项验证当轮回记录行（通知项/验证点/结果/证据/署名）；发现问题必立 BUG-{NNN} 并反馈 human，不滞留
  复盘:
    - 输入=台账统计+四类代码问题+被环境挡住的正向用例+方案变更清单
    - 已知缺口必须列出，不因主流程已过而省略
    - 11 必含「KB 候选」节（无条目写「无」）；本节点不自动入库，沉淀等 workflow-learnings-to-kb 人工 gate（F06/D003-v3）
  知识库更新:
    - 自动节点：切 master + pull + GitNexus 重建索引
